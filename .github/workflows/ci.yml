name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches `.tool-versions`.
  RUST_VERSION: "1.99.1"

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    env:
      MIX_ENV: test

    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported.
          - os: ubuntu-24.04
            elixir: "1.16"
            otp: "26"

          # Matches `.tool-versions`.
          - os: ubuntu-24.04
            elixir: "1.20.5"
            otp: "29.1.2"

          - os: macos-15
            elixir: "1.20.5"
            otp: "29.1.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # The NIF is built against the OTP version's NIF API.
          key: otp-${{ matrix.otp }}

      - name: Restore deps and _build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-test-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-test-

      - name: Install dependencies
        run: mix deps.get --only test

      - name: Remove compiled application files
        run: mix clean

      - name: Run tests
        run: mix test

      - name: Run native tests
        run: cargo test

  static-checks:
    name: Static Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # Matches `.tool-versions`.
      ELIXIR_VERSION: "1.20.5"
      OTP_VERSION: "29.1.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Restore deps and _build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-dev-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-dev-

      # Erlang and Elixir PLTs. The dependencies' PLT is in _build, cached above.
      - name: Restore Dialyzer PLT cache
        uses: actions/cache@v6
        with:
          path: ~/.mix/dialyxir_*
          key: plt-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}

      - name: Install dependencies
        run: mix deps.get

      - name: Remove compiled application files
        run: mix clean

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run Credo
        run: mix credo

      - name: Run Dialyzer
        run: mix dialyzer

      - name: Build docs
        run: mix docs --warnings-as-errors

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
